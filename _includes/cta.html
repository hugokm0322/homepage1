{% assign office = site.data.office %}
<section class="section">
  <div class="container">
    <div class="cta-card">
      <div>
        <p class="eyebrow eyebrow--light">Contact</p>
        <h2>{{ include.title | default: "첫 상담에서<br>방향이 보이기 시작합니다." }}</h2>
        <p>{{ office.hours }}</p>
      </div>
      <div class="cta-actions">
        <a class="btn btn-light" href="tel:{{ office.phone | remove: '-' }}">{{ office.phone }}</a>
        {% if include.hide_location %}
        <a class="btn btn-ghost" href="mailto:{{ office.email }}">이메일 문의</a>
        {% else %}
        <a class="btn btn-ghost" href="{{ '/location/' | relative_url }}">오시는 길</a>
        {% endif %}
      </div>
    </div>
  </div>
</section>
