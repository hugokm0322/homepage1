<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- 법률사무소 현주 상담실 일러스트 (실제 사진으로 교체 전 임시 이미지) -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e4da"/>
      <stop offset="1" stop-color="#f4f1ea"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ece3"/>
      <stop offset="1" stop-color="#f3f8f4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79c72"/>
      <stop offset="1" stop-color="#a87c55"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98a5e"/>
      <stop offset="1" stop-color="#94673f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fffdf5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fa27c"/>
      <stop offset="1" stop-color="#2a6f50"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".35" r=".6">
      <stop offset="0" stop-color="#fffbe9" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fffbe9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 벽 -->
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <!-- 원목 벽 패널 (왼쪽) -->
  <g fill="#c9a47d">
    <rect x="0" y="0" width="760" height="820"/>
  </g>
  <g stroke="#b58e66" stroke-width="3">
    <path d="M95 0v820M190 0v820M285 0v820M380 0v820M475 0v820M570 0v820M665 0v820"/>
  </g>
  <!-- 책장 -->
  <g>
    <rect x="120" y="140" width="520" height="560" rx="6" fill="#8e6340"/>
    <rect x="140" y="160" width="480" height="520" fill="#6f4b2e"/>
    <g fill="#8e6340">
      <rect x="140" y="290" width="480" height="14"/>
      <rect x="140" y="430" width="480" height="14"/>
      <rect x="140" y="570" width="480" height="14"/>
    </g>
    <!-- 책 -->
    <g>
      <rect x="160" y="200" width="26" height="90" fill="#2f6b52"/>
      <rect x="190" y="210" width="22" height="80" fill="#e8dfcf"/>
      <rect x="216" y="195" width="30" height="95" fill="#24563f"/>
      <rect x="250" y="215" width="20" height="75" fill="#b5835a"/>
      <rect x="274" y="205" width="28" height="85" fill="#3f8a67"/>
      <rect x="440" y="240" width="120" height="16" fill="#e8dfcf"/>
      <rect x="450" y="256" width="110" height="18" fill="#2f6b52"/>
      <rect x="445" y="274" width="115" height="16" fill="#b5835a"/>
      <rect x="170" y="345" width="30" height="85" fill="#e8dfcf"/>
      <rect x="204" y="350" width="26" height="80" fill="#24563f"/>
      <rect x="234" y="340" width="24" height="90" fill="#2f6b52"/>
      <rect x="262" y="355" width="28" height="75" fill="#b5835a"/>
      <rect x="294" y="345" width="22" height="85" fill="#3f8a67"/>
      <rect x="320" y="350" width="30" height="80" fill="#e8dfcf"/>
      <circle cx="520" cy="400" r="28" fill="#dcbb95"/>
      <rect x="500" y="420" width="40" height="10" fill="#b5835a"/>
      <rect x="380" y="485" width="26" height="85" fill="#24563f"/>
      <rect x="410" y="490" width="22" height="80" fill="#e8dfcf"/>
      <rect x="436" y="480" width="30" height="90" fill="#2f6b52"/>
      <rect x="470" y="495" width="24" height="75" fill="#b5835a"/>
      <rect x="498" y="485" width="26" height="85" fill="#3f8a67"/>
      <rect x="180" y="620" width="140" height="16" fill="#e8dfcf"/>
      <rect x="185" y="636" width="130" height="18" fill="#2f6b52"/>
      <rect x="180" y="654" width="140" height="16" fill="#b5835a"/>
    </g>
  </g>

  <!-- 창문 -->
  <rect x="930" y="110" width="860" height="640" rx="4" fill="#f7f4ee"/>
  <rect x="955" y="135" width="810" height="590" fill="url(#sky)"/>
  <!-- 창밖 나무 실루엣 -->
  <g fill="#a9d1bd" opacity=".7">
    <ellipse cx="1100" cy="640" rx="170" ry="120"/>
    <ellipse cx="1300" cy="670" rx="150" ry="90"/>
    <ellipse cx="1620" cy="620" rx="190" ry="140"/>
  </g>
  <g fill="#8cc0a6" opacity=".6">
    <ellipse cx="1020" cy="690" rx="120" ry="70"/>
    <ellipse cx="1700" cy="680" rx="120" ry="80"/>
  </g>
  <g fill="#f7f4ee">
    <rect x="1350" y="135" width="20" height="590"/>
    <rect x="955" y="420" width="810" height="16"/>
  </g>
  <rect x="915" y="740" width="890" height="26" rx="4" fill="#e3ddd1"/>

  <!-- 빛 -->
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <polygon points="955,135 1765,135 1500,1080 700,1080" fill="url(#beam)" opacity=".5"/>

  <!-- 바닥 -->
  <rect x="0" y="820" width="1920" height="260" fill="url(#floor)"/>
  <g stroke="#b88d63" stroke-width="2" opacity=".6">
    <path d="M0 880h1920M0 950h1920M0 1020h1920"/>
  </g>
  <rect x="0" y="812" width="1920" height="10" fill="#8e6340"/>

  <!-- 식물 -->
  <g>
    <path d="M820 800 l-10 -150 M835 800 l30 -170 M850 800 l-60 -120" stroke="#2a6f50" stroke-width="6" fill="none"/>
    <ellipse cx="800" cy="630" rx="46" ry="90" transform="rotate(-25 800 630)" fill="url(#leaf)"/>
    <ellipse cx="870" cy="600" rx="44" ry="96" transform="rotate(18 870 600)" fill="url(#leaf)"/>
    <ellipse cx="760" cy="700" rx="40" ry="80" transform="rotate(-60 760 700)" fill="#3f8a67"/>
    <ellipse cx="905" cy="690" rx="38" ry="78" transform="rotate(55 905 690)" fill="#3f8a67"/>
    <ellipse cx="830" cy="560" rx="36" ry="84" fill="#4fa27c"/>
    <path d="M780 790 h110 l-14 120 h-82 z" fill="#efe8dc"/>
    <rect x="775" y="782" width="120" height="16" rx="4" fill="#e3d9c8"/>
  </g>

  <!-- 책상 -->
  <g>
    <rect x="1040" y="770" width="700" height="34" rx="6" fill="url(#desk)"/>
    <rect x="1080" y="804" width="24" height="200" fill="#7d5533"/>
    <rect x="1676" y="804" width="24" height="200" fill="#7d5533"/>
    <rect x="1104" y="820" width="572" height="12" fill="#8e6340"/>
    <!-- 노트북 -->
    <path d="M1300 768 l30 -150 h250 l-30 150 z" fill="#2d3833"/>
    <path d="M1316 755 l26 -124 h222 l-26 124 z" fill="#dfeee6"/>
    <rect x="1270" y="764" width="300" height="8" rx="3" fill="#3a4741"/>
    <!-- 서류 -->
    <rect x="1120" y="752" width="140" height="16" rx="2" fill="#fbfaf7" transform="rotate(-4 1190 760)"/>
    <rect x="1128" y="742" width="130" height="14" rx="2" fill="#f1ebe0" transform="rotate(3 1190 750)"/>
    <!-- 머그컵 -->
    <rect x="1620" y="720" width="44" height="50" rx="8" fill="#2f7a5b"/>
    <path d="M1664 732 a14 14 0 0 1 0 28" stroke="#2f7a5b" stroke-width="7" fill="none"/>
    <!-- 스탠드 -->
    <path d="M1690 768 v-4 h50 v4 z" fill="#2d3833"/>
    <path d="M1714 764 l-30 -150" stroke="#2d3833" stroke-width="6"/>
    <path d="M1650 620 l70 -40 l24 36 z" fill="#2d3833"/>
  </g>

  <!-- 의자 -->
  <g>
    <rect x="1250" y="840" width="190" height="30" rx="12" fill="#24563f"/>
    <rect x="1340" y="870" width="12" height="120" fill="#2d3833"/>
    <path d="M1275 1000 h140" stroke="#2d3833" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
